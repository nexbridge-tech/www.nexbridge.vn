case_study:
  eyebrow: "HOW THIS PLAYS OUT"
  title: "Representative Engineering Scenarios"
  subtitle: "Illustrative scenarios reflecting the type of engineering challenges and approach we bring to a project — not specific named clients or reported results."
  cards:
    - image: "/assets/images/case-illustrative-thermal.svg"
      tag: "Thermal Management"
      title: "Cold-Plate Design For A Traction Inverter Module"
      description: "A typical starting point: a power module's thermal design validated on a single hand-built sample, with no statistical view of bond-line thickness across production tolerance. The engineering work is sizing the cold-plate and TIM selection against the module's real switching losses and duty cycle, then validating under worst-case mounting pressure and tolerance stack-up — not the bench-built best case."
      link_text: "Discuss A Similar Challenge →"
      link: "/solutions/thermal-management.html"
    - image: "/assets/images/knowledge-placeholder-networking.svg"
      tag: "Industrial Networking"
      title: "SCADA Connectivity For A Distributed BESS Fleet"
      description: "A common pattern for developers operating storage sites across different regions: fiber at some sites, cellular or wireless at others, and a dispatch layer that needs to treat every site consistently regardless of backhaul. The engineering work is architecting SCADA/EMS connectivity against each site's real infrastructure, not a single reference design assumed to apply everywhere."
      link_text: "Discuss A Similar Challenge →"
      link: "/solutions/industrial-networking.html"
    - image: "/assets/images/case-illustrative-consulting.svg"
      tag: "Engineering Consulting"
      title: "ASPICE Process Alignment For An EV E/E Program"
      description: "A frequent starting condition: a development process that satisfies internal milestones but hasn't been genuinely benchmarked against ASPICE process maturity requirements until a customer audit is already on the calendar. The engineering work is aligning the process from the inside — real capability, not audit-ready appearance — starting early enough that the alignment is substantive, not cosmetic."
      link_text: "Discuss A Similar Challenge →"
      link: "/solutions/engineering-consulting.html"

