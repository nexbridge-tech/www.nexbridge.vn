backend:
  name: git-gateway
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

site_url: https://nexbridge.vn
display_url: https://nexbridge.vn

collections:
  - name: "knowledge"
    label: "Knowledge Articles"
    folder: "content/knowledge"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "article.njk" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "yyyy-MM-dd" }
      - label: "Tags"
        name: "tags"
        widget: "select"
        multiple: true
        options:
          - "Engineering Journal"
          - "Field Notes"
          - "Lessons Learned"
          - "Technical Guides"
          - "Career Development"
          - "Manufacturing"
          - "Semiconductor"
          - "AI Infrastructure"
          - "Industrial Automation"
          - "Thermal Management"
          - "Industrial Networking"
          - "Supply Chain"
          - "Renewable Energy"
          - "Grid Integration"
          - "Motor Control"
          - "Calibration"
          - "Functional Safety"
          - "PCB Design"
          - "Component Selection"
          - "EMI / EMC"
          - "Power Electronics"
          - "6-in-1"
          - "OBC"
          - "DC-DC"
          - "Robotics"
          - "Motion Control"
          - "EtherCAT"
          - "Reliability"
      - label: "Primary Topic"
        name: "topic"
        widget: "select"
        options:
          - "Renewable Energy & Grid Integration"
          - "Energy Storage Systems"
          - "Automotive & EV Power Electronics"
          - "PCB Design, Components & EMC"
          - "Robotics & Motion Control"
          - "Engineering Consulting & Process"
          - "Semiconductor & Manufacturing"
          - "Industrial Networking & Automation"
          - "Thermal Management"
          - "AI Infrastructure"
          - "Career & Culture"
      - { label: "Knowledge Series", name: "series", widget: "string", required: false, hint: "Optional recurring series, for example BESS Safety & Controls." }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "Short summary shown on the Knowledge listing page and in search results." }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: true, hint: "Draft articles are hidden from the live site until this is turned off." }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    files:

      - name: "home"
        label: "Home Page"
        file: "_data/home.yml"
        fields:
          - { label: "SEO Title", name: "seo_title", widget: "string" }
          - { label: "SEO Description", name: "seo_description", widget: "text" }
          - label: "Hero Banner"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow Text", name: "eyebrow", widget: "string" }
              - { label: "Headline (before highlight)", name: "headline_before", widget: "string" }
              - { label: "Headline (highlighted part)", name: "headline_accent", widget: "string" }
              - { label: "Headline (after highlight)", name: "headline_after", widget: "string" }
              - { label: "Lead Paragraph", name: "lead", widget: "text" }
              - { label: "Primary Button Text", name: "cta_primary_text", widget: "string" }
              - { label: "Primary Button Link", name: "cta_primary_link", widget: "string" }
              - { label: "Secondary Button Text", name: "cta_secondary_text", widget: "string" }
              - { label: "Secondary Button Link", name: "cta_secondary_link", widget: "string" }
              - label: "Process Steps Strip (6 items)"
                name: "strip"
                widget: "list"
                fields:
                  - label: "Icon"
                    name: "icon"
                    widget: "select"
                    options: ["server", "chip", "robot", "thermometer", "leaf", "handshake", "compass", "eye", "layers"]
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link", name: "link", widget: "string" }
          - label: "Design Services Section"
            name: "design_services"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - label: "Cards"
                name: "cards"
                widget: "list"
                fields:
                  - { label: "Photo", name: "image", widget: "image" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - label: "Explore Section"
            name: "explore"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Cards"
                name: "cards"
                widget: "list"
                fields:
                  - label: "Icon"
                    name: "icon"
                    widget: "select"
                    options: ["layers", "factory", "book", "info", "network", "mail"]
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Link Text", name: "link_text", widget: "string" }
